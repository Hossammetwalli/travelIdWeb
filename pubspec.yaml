name: webapptrial
description: Travel ID connects travelers with independent travel experts to make faster and better travel decisions, find the right things to do and focusing only on fun, not logistics!.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: any
  firebase_core:
  cloud_firestore: any
  firebase_auth: any
  firebase_storage:
  fluttertoast: any
  firebase_analytics: ^8.3.3
  google_fonts: ^2.1.0
  auto_size_text: any
  flutter_form_builder: ^6.0.0
  universal_html: ^2.0.8
  url_launcher: any
  uuid:
  country_code_picker: any
  animated_text_kit: any
  flutter_typeahead: any
  infinite_carousel: ^1.0.1
  seo_renderer: ^0.3.0
  url_strategy: ^0.2.0

dependency_overrides:
  intl: any
  http: any
  flutter_form_builder: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

